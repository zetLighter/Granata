version: '3.1'

services:
  granate:
    image: '40b571c12d66'
    container_name: granate
    expose:
      - '4932'
    ports:
      - '4932:4932'
    environment:
      - DB_USERNAME=zetLight
      - DB_PASSWORD=GGmain15
      - DB_URL=jdbc:postgresql://db:5432/granate
    depends_on:
      - db
  db:
    image: 'postgres'
    container_name: db
    expose:
      - '5432'
    environment:
      - POSTGRES_USER=zetLight
      - POSTGRES_PASSWORD=GGmain15

