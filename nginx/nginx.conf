worker_processes auto;

events { worker_connections 1024; }
http {
    include mime.types;
    default_type application/octet-stream;
    sendfile on;
    keepalive_timeout 65;

    server {
        listen 80;
        server_name screb.ru www.screb.ru;
        
        root /usr/share/nginx/html;
        index index.html;
	
	location /.well-known/acme-challenge/ {
	   root /var/www/certbot;
	}

        location / {
            try_files $uri /index.html;
        }

        location /back/ {
            proxy_pass http://backend:4932/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Photo $scheme;
        }
    }
    server {
        listen 443 ssl;
        server_name screb.ru www.screb.ru;

        ssl_certificate /etc/letsencrypt/live/screb.ru/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/screb.ru/privkey.pem;

        root /usr/share/nginx/html;
        index index.html;

        location / {
            try_files $uri /index.html;
        }

        location /back/ {
            proxy_pass http://backend:4932/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
